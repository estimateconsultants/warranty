<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Warranty Punch List</title>
<meta name="theme-color" content="#2457C5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Punch List">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app. Sticky header + tabs, list grouped by room, fixed bottom camera bar, bottom sheet for each entry. */
:root{
  padding-top:env(safe-area-inset-top,0px);
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#18212D; --muted:#5D6878; --line:#DCE1E8;
  --accent:#2457C5; --accent-ink:#FFFFFF; --tape:#E8A317; --ok:#1E8A55; --bad:#C2372F;
  --chip:#E8EDF5;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151C; --surface:#18202A; --ink:#E7ECF2; --muted:#98A3B3; --line:#2A3542;
  --accent:#6E98F0; --accent-ink:#0C1320; --tape:#F0B93E; --ok:#4CC08A; --bad:#EE6A61; --chip:#222C39; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#18202A; --ink:#E7ECF2; --muted:#98A3B3; --line:#2A3542;
  --accent:#6E98F0; --accent-ink:#0C1320; --tape:#F0B93E; --ok:#4CC08A; --bad:#EE6A61; --chip:#222C39; color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.hrow h1{font-family:var(--f-display);font-weight:700;font-size:1.55rem;letter-spacing:.01em;margin:0;line-height:1.05;text-wrap:balance;flex:1;min-width:0}
.hrow h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:.82rem;color:var(--muted);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap}
.count b{display:block;font-family:var(--f-display);font-size:1.6rem;color:var(--ink);line-height:1}
.tabs{display:flex;gap:4px;padding-block:0 8px}
.tabs button{flex:1;border:0;background:transparent;padding:8px 0;border-radius:8px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--chip);color:var(--ink)}

.banner{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:.9rem;color:var(--muted)}
.banner:empty{display:none}

main{padding-block:12px 140px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:.75rem;opacity:.7;margin-left:4px}

.room{margin-top:18px}
.room h2{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:1rem;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.room h2::after{content:"";flex:1;height:1px;background:var(--line)}
.list{display:grid;gap:8px}
.card{display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;width:100%}
.thumb{flex:none;width:84px;height:84px;border-radius:8px;background:var(--chip) center/cover no-repeat;position:relative}
.thumb .pc{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-family:var(--f-mono);font-size:.7rem;padding:1px 5px;border-radius:4px}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-top:2px}
.num{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.issue{font-weight:700;overflow-wrap:anywhere}
.loc{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.meta{margin-top:auto;display:flex;gap:8px;align-items:center;font-size:.8rem}
.st{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.st.saving{color:var(--muted)} .st.saved{color:var(--ok)} .st.err{color:var(--bad)}
.tag{border-radius:4px;padding:1px 6px;font-weight:700;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}
.tag.open{background:var(--tape);color:#1d1606}
.tag.fixed{background:var(--ok);color:#fff}
.card.isfixed .issue{text-decoration:line-through;opacity:.7}

.empty{margin-top:28px;text-align:center;color:var(--muted);padding:28px 16px;border:1.5px dashed var(--line);border-radius:14px}
.empty strong{display:block;font-family:var(--f-display);font-size:1.4rem;color:var(--ink);margin-bottom:4px}

.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
.spin.big{width:28px;height:28px;border-width:3px}
@keyframes sp{to{transform:rotate(360deg)}}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(transparent,var(--bg) 30%);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-top:20px}
.bar .wrap{display:flex;gap:10px}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);flex:1;font-size:1.1rem;padding:16px}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.btn.wait{filter:blur(1px);opacity:.6;pointer-events:none}
.btn svg{width:22px;height:22px;flex:none}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:92%;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet .wrap{display:grid;gap:14px;padding-block:14px 0}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.shead{display:flex;justify-content:space-between;align-items:center}
.shead h3{margin:0;font-family:var(--f-display);font-size:1.4rem}
.x{border:0;background:var(--chip);border-radius:999px;width:36px;height:36px;font-size:1.2rem}
.photos{display:flex;gap:8px;overflow-x:auto}
.ph{flex:none;width:120px;height:120px;border-radius:10px;background:var(--chip) center/cover no-repeat;position:relative}
.ph button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:.9rem;line-height:1}
.addph{flex:none;width:120px;height:120px;border-radius:10px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-size:.85rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.lbl{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{padding:8px 12px}
.inp{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;font-size:16px}
.quick{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.quick .chip{font-size:.82rem;padding:5px 10px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2 .btn{flex:1;min-width:140px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.exist{display:grid;gap:0}
.exlist{display:grid;gap:6px;max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--bg)}
.exnone{font-size:.9rem;color:var(--muted)}
.exrow{display:flex;gap:10px;align-items:center;min-width:0}
.exth{flex:none;width:48px;height:48px;border-radius:6px;background:var(--chip) center/cover no-repeat}
.exbody{flex:1;min-width:0;display:flex;flex-direction:column}
.extx{font-weight:600;font-size:.95rem;overflow-wrap:anywhere}
.exrow.isfixed .extx{text-decoration:line-through;opacity:.7}
.exadd{flex:none;padding:8px 10px;font-size:.82rem}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--chip);padding:10px;border-radius:10px;font-size:.92rem}

/* report preview */
.rhead{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:4px}
.rhead .t{font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1.1}
.rhead .s{color:var(--muted);font-size:.92rem}
.rsum{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rsum span{font-family:var(--f-mono);font-size:.78rem;background:var(--chip);border-radius:6px;padding:3px 8px}
.ritem{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.ritem .rp{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.ritem .rp div{aspect-ratio:4/3;max-width:100%;border-radius:8px;background:var(--chip) center/cover no-repeat}
.rtools{display:grid;gap:10px;margin-top:12px}

/* setup */
.form{display:grid;gap:14px}
.roomrow{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px}
.roomrow span{flex:1;min-width:0}
.roomrow button{border:0;background:var(--chip);border-radius:8px;width:34px;height:34px}
.saved-note{font-size:.82rem;color:var(--muted);min-height:1.2em}

.gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gbox{width:100%;max-width:340px;display:grid;gap:12px;text-align:center;color:var(--accent)}
.gbox h2{margin:0 0 8px;font-family:var(--f-display);font-size:1.8rem;color:var(--ink)}
.gbox .lbl{text-align:left;margin:0}
.gbox .saved-note{min-height:1.4em;display:flex;gap:8px;justify-content:center;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2s}}
</style>

</head>
<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <h1 id="hTitle">Warranty Punch List<small id="hSub">Tap Setup to add your address and builder</small></h1>
      <div class="count"><b id="hCount">0</b>open items</div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-items" aria-selected="true" data-v="items">Items</button>
      <button role="tab" id="tab-report" aria-selected="false" data-v="report">Report</button>
      <button role="tab" id="tab-setup" aria-selected="false" data-v="setup">Setup</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="banner" id="banner"></div>
  <section id="v-items"><div class="empty"><span class="spin big"></span><br>Loading items…</div></section>
  <section id="v-report" hidden></section>
  <section id="v-setup" hidden></section>
</main>

<div class="bar" id="bar">
  <div class="wrap">
    <button class="btn primary" id="shootBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Take photo
    </button>
    <button class="btn ghost" id="libBtn" aria-label="Choose from photo library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>
    </button>
  </div>
</div>

<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="libIn" accept="image/*" multiple hidden>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sTitle"></div>
<div class="toast" id="toast" hidden></div>

<div class="gate" id="gate" hidden>
  <form class="gbox" id="gateForm" autocomplete="off">
    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <h2>Warranty Punch List</h2>
    <label class="lbl" for="gatePw">Password</label>
    <input class="inp" id="gatePw" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button class="btn primary" id="gateBtn" type="submit">Open</button>
    <div class="saved-note" id="gateMsg"></div>
  </form>
</div>
<script src="config.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
const DEFAULT_ROOMS=["Kitchen","Living Room","Dining Room","Primary Bedroom","Primary Bath","Bedroom 2","Bedroom 3","Bathroom 2","Laundry","Garage","Hallway / Stairs","Exterior"];
const QUICK=["Drywall crack","Nail pop","Paint touch-up","Caulk gap","Scratch / chip","Door won't latch","Cabinet adjustment","Grout / tile crack","Water stain / leak","Trim gap","Floor squeak","Outlet / switch"];
const POLL_MS=15000;

const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
// access key from the shared link (?k=...), remembered on this phone
const SCRIPT_URL=(window.PUNCH_CONFIG||{}).scriptUrl||"https://script.google.com/macros/s/AKfycbwIte83MJal_BG8DHY8Gqr5LiDlHkFqHiph_c_wuO0kHOd6bBGtj1SltozAVnDOGDb61w/exec";
let PW=ls.get("pl_pw")||"";

let items={};          // id -> item
let localState={};     // id -> {status:'saving'|'saved'|'err'}
let imgCache={};       // url or tmp key -> dataURL
let settings={title:"",address:"",builder:"",owner:"",rooms:DEFAULT_ROOMS.slice()};
let view="items", filter="All", lastRoom=ls.get("pl_lastRoom"), myName=ls.get("pl_name")||"";
let sheetState=null, loaded=false, reportScope="open", addToSheet=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
function toast(msg,ms){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms||1800)}
function banner(msg){$("#banner").textContent=msg||""}

// All calls go to the Google Apps Script web app (saves to your Drive + Sheet).
// Sent as plain text so the browser doesn't need a pre-check request.
async function api(action,data){
  if(!SCRIPT_URL)throw new Error("The app isn't connected to Google yet (config.js).");
  const r=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify(Object.assign({action,pw:PW},data||{})),redirect:"follow"});
  let j={};try{j=await r.json()}catch(e){throw new Error("Google didn't answer. Check your connection and try again.")}
  if(j.auth===false){lock();throw new Error("Enter the password")}
  if(j.error)throw new Error(j.error);
  return j;
}

/* ---------- password screen ---------- */
function lock(msg){
  PW="";ls.set("pl_pw","");
  const g=$("#gate");g.hidden=false;$("#gateMsg").textContent=msg||"";setTimeout(()=>$("#gatePw").focus(),50);
}
$("#gateForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const v=$("#gatePw").value.trim();if(!v)return;
  const b=$("#gateBtn");b.classList.add("wait");$("#gateMsg").innerHTML='<span class="spin"></span> Checking…';
  PW=v;
  try{await api("check");ls.set("pl_pw",PW);$("#gate").hidden=true;$("#gatePw").value="";refresh()}
  catch(err){$("#gateMsg").textContent=err.message==="Enter the password"?"That password isn't right.":err.message}
  finally{b.classList.remove("wait")}
});

/* ---------- loading + polling ---------- */
async function refresh(){
  try{
    if(!PW){lock();return}
    const d=await api("list");
    loaded=true;banner("");
    if(d.settings){settings=Object.assign({},settings,d.settings);if(!settings.rooms||!settings.rooms.length)settings.rooms=DEFAULT_ROOMS.slice()}
    const next={};
    d.items.forEach(it=>next[it.id]=it);
    // keep items that are still saving or failed on this phone
    Object.keys(localState).forEach(id=>{if(localState[id].status!=="saved"&&items[id])next[id]=items[id]});
    items=next;render();
  }catch(e){
    if(!loaded){$("#v-items").innerHTML="";}
    if(e.message==="Enter the password")return;
    banner(e.message.includes("config.js")?e.message:"Can't reach the shared list right now. Check your signal and try again.");
    if(!loaded){loaded=true;render()}
  }
}
setInterval(()=>{if(!document.hidden&&!sheetState)refresh()},POLL_MS);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});

/* ---------- image handling ---------- */
function compress(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{
      const max=1600;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);res({dataUrl:c.toDataURL("image/jpeg",0.8),w,h});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("That file couldn't be read as a photo."))};
    img.src=url;
  });
}
const driveThumb=id=>"https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w1000";
function photoSrc(p){return imgCache[p.id]||imgCache[p.tmp]||(p.id?driveThumb(p.id):"")}

/* ---------- derived ---------- */
function sorted(){return Object.values(items).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}
function numberMap(){const m={};sorted().forEach((it,i)=>m[it.id]=i+1);return m}
function roomOrder(){const r=settings.rooms.slice();sorted().forEach(it=>{if(it.room&&!r.includes(it.room))r.push(it.room)});return r}

/* ---------- render ---------- */
function render(){
  const all=sorted();const open=all.filter(i=>i.status!=="fixed");
  $("#hCount").textContent=open.length;
  $("#hTitle").firstChild.nodeValue=settings.title||"Warranty Punch List";
  $("#hSub").textContent=[settings.address,settings.builder].filter(Boolean).join(" · ")||"Tap Setup to add your address and builder";
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===view));
  ["items","report","setup"].forEach(v=>$("#v-"+v).hidden=v!==view);
  $("#bar").hidden=view==="setup";
  if(!loaded)return;
  if(view==="items")renderItems(all);
  if(view==="report")renderReport(all);
  if(view==="setup"&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#v-setup input")))renderSetup();
}

function statusHtml(id){
  const s=localState[id];
  if(!s)return "";
  if(s.status==="saved")return '<span class="st saved">✓ Saved</span>';
  if(s.status==="saving")return '<span class="st saving"><span class="spin"></span>Saving…</span>';
  return '<span class="st err">Not saved · tap to retry</span>';
}

function renderItems(all){
  const nm=numberMap();const rooms=roomOrder();
  const counts={};all.forEach(i=>counts[i.room]=(counts[i.room]||0)+1);
  let h="";
  if(all.length){
    h+='<div class="filters">'+["All"].concat(rooms.filter(r=>counts[r])).map(r=>`<button class="chip" data-f="${esc(r)}" aria-pressed="${filter===r}">${esc(r)}<span class="n">${r==="All"?all.length:counts[r]}</span></button>`).join("")+'</div>';
  }else{
    h+=`<div class="empty"><strong>No damage logged yet</strong>Tap <b>Take photo</b>, pick the room, and type what needs fixing. Everyone with the link sees new items here, grouped by room.</div>`;
  }
  rooms.forEach(r=>{
    if(filter!=="All"&&filter!==r)return;
    const list=all.filter(i=>i.room===r);if(!list.length)return;
    h+=`<div class="room"><h2>${esc(r)}</h2><div class="list">`;
    list.forEach(it=>{
      const p=(it.photos||[])[0];
      h+=`<button class="card ${it.status==="fixed"?"isfixed":""}" data-id="${esc(it.id)}">
        <div class="thumb" style="${p?`background-image:url('${esc(photoSrc(p))}')`:""}">${(it.photos||[]).length>1?`<span class="pc">${it.photos.length}</span>`:""}</div>
        <div class="cbody"><span class="num">ITEM ${pad(nm[it.id])}${it.addedBy?` · ${esc(it.addedBy)}`:""}</span><span class="issue">${esc(it.issue||"No description")}</span>${it.location?`<span class="loc">${esc(it.location)}</span>`:""}
        <span class="meta"><span class="tag ${it.status==="fixed"?"fixed":"open"}">${it.status==="fixed"?"Fixed":"Open"}</span>${statusHtml(it.id)}</span></div></button>`;
    });
    h+="</div></div>";
  });
  $("#v-items").innerHTML=h;
}

function reportItems(all){return reportScope==="open"?all.filter(i=>i.status!=="fixed"):all}
function renderReport(all){
  const list=reportItems(all);const rooms=roomOrder();const nm=numberMap();
  const counts={};list.forEach(i=>counts[i.room]=(counts[i.room]||0)+1);
  let h=`<div class="rhead"><div class="t">${esc(settings.title||"Builder Warranty Punch List")}</div>
    <div class="s">${esc([settings.address,settings.builder&&("Builder: "+settings.builder),settings.owner&&("Homeowner: "+settings.owner)].filter(Boolean).join(" · ")||"Add your address and builder in Setup")}</div>
    <div class="s">${new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})} · ${list.length} item${list.length===1?"":"s"}</div>
    <div class="rsum">${rooms.filter(r=>counts[r]).map(r=>`<span>${esc(r)} ${counts[r]}</span>`).join("")}</div></div>
    <div class="rtools">
      <div class="seg"><button data-scope="open" aria-pressed="${reportScope==="open"}">Open items only</button><button data-scope="all" aria-pressed="${reportScope==="all"}">All items</button></div>
      <button class="btn primary" id="pdfBtn" ${list.length?"":"disabled"}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>Make PDF report</button>
      <div id="pdfOut"></div>
    </div>`;
  rooms.forEach(r=>{
    const l=list.filter(i=>i.room===r);if(!l.length)return;
    h+=`<div class="room"><h2>${esc(r)}</h2><div class="list">`;
    l.forEach(it=>{
      h+=`<div class="ritem"><div><span class="num">ITEM ${pad(nm[it.id])}</span> ${it.status==="fixed"?'<span class="tag fixed">Fixed</span>':""}</div><div class="issue">${esc(it.issue||"No description")}</div>${it.location?`<div class="loc">${esc(it.location)}</div>`:""}
      <div class="rp">${(it.photos||[]).map(p=>`<div style="background-image:url('${esc(photoSrc(p))}')"></div>`).join("")}</div></div>`;
    });
    h+="</div></div>";
  });
  $("#v-report").innerHTML=h;
}

function renderSetup(){
  $("#v-setup").innerHTML=`<div class="form">
    <div><label class="lbl" for="sName">Your name (shows on items you add)</label><input class="inp" id="sName" value="${esc(myName)}" autocomplete="name"></div>
    <div><label class="lbl" for="sTitleIn">Report title</label><input class="inp" id="sTitleIn" value="${esc(settings.title)}" placeholder="Warranty Punch List"></div>
    <div><label class="lbl" for="sAddr">Property address</label><input class="inp" id="sAddr" value="${esc(settings.address)}"></div>
    <div><label class="lbl" for="sOwner">Homeowner</label><input class="inp" id="sOwner" value="${esc(settings.owner)}"></div>
    <div><label class="lbl" for="sBuilder">Builder</label><input class="inp" id="sBuilder" value="${esc(settings.builder)}"></div>
    <div class="saved-note" id="setNote"></div>
    <div><span class="lbl">Rooms</span><div class="list">${settings.rooms.map((r,i)=>`<div class="roomrow"><span>${esc(r)}</span><button data-up="${i}" aria-label="Move ${esc(r)} up">↑</button><button data-del="${i}" aria-label="Remove ${esc(r)}">✕</button></div>`).join("")}</div>
      <div style="display:flex;gap:8px;margin-top:8px"><input class="inp" id="newRoom" placeholder="Add a room, e.g. Bonus Room"><button class="btn ghost" id="addRoom">Add</button></div></div>
  </div>`;
}

/* ---------- saving ---------- */
async function saveSettings(patch){
  Object.assign(settings,patch);render();
  const note=()=>$("#setNote");if(note())note().innerHTML='<span class="spin"></span> Saving…';
  try{await api("settings",{settings});if(note())note().textContent="✓ Saved"}
  catch(e){if(note())note().textContent="Not saved: "+e.message}
}

async function persistItem(id){
  const it=items[id];if(!it)return;
  localState[id]={status:"saving"};render();
  try{
    for(const p of it.photos){
      if(!p.id){
        const r=await api("photo",{data:imgCache[p.tmp],room:it.room,issue:it.issue||""});
        p.id=r.id;imgCache[r.id]=imgCache[p.tmp];
      }
    }
    const body={id,room:it.room,issue:it.issue||"",location:it.location||"",status:it.status||"open",addedBy:it.addedBy||"",createdAt:it.createdAt,
      photos:it.photos.map(p=>({id:p.id,w:p.w,h:p.h}))};
    const r=await api("save",{item:body});
    items[id]=r.item;
    localState[id]={status:"saved"};render();
    setTimeout(()=>{if(localState[id]&&localState[id].status==="saved"){delete localState[id];render()}},4000);
  }catch(e){
    localState[id]={status:"err"};render();
    toast("Not saved: "+e.message,3500);
  }
}

/* ---------- sheet ---------- */
function openSheet(state){sheetState=state;$("#scrim").hidden=false;$("#sheet").hidden=false;drawSheet()}
function closeSheet(){sheetState=null;$("#scrim").hidden=true;$("#sheet").hidden=true;$("#sheet").innerHTML=""}
function drawSheet(){
  const s=sheetState;if(!s)return;const isNew=!s.id;
  $("#sheet").innerHTML=`<div class="wrap"><div class="grab"></div>
    <div class="shead"><h3 id="sTitle">${isNew?"New item":"Edit item"}</h3><button class="x" id="sClose" aria-label="Close">✕</button></div>
    <div class="photos">${s.photos.map((p,i)=>`<div class="ph" style="background-image:url('${esc(photoSrc(p))}')"><button data-rmph="${i}" aria-label="Remove photo">✕</button></div>`).join("")}
      <button class="addph" id="addAngle"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add another photo</button></div>
    <div><span class="lbl">Room</span><div class="chips">${roomOrder().map(r=>{const c=Object.values(items).filter(i=>i.room===r&&i.id!==s.id).length;return `<button class="chip" data-room="${esc(r)}" aria-pressed="${s.room===r}">${esc(r)}${c?`<span class="n">${c}</span>`:""}</button>`}).join("")}</div></div>
    ${existingHtml(s)}
    <div><label class="lbl" for="issueIn">What needs fixing</label><input class="inp" id="issueIn" value="${esc(s.issue)}" placeholder="e.g. Drywall crack above door" autocomplete="off" enterkeyhint="next">
      <div class="quick">${QUICK.map(q=>`<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div></div>
    <div><label class="lbl" for="locIn">Where in the room (optional)</label><input class="inp" id="locIn" value="${esc(s.location)}" placeholder="e.g. Left of window, near ceiling" autocomplete="off" enterkeyhint="done"></div>
    ${myName?"":`<div><label class="lbl" for="nameIn">Your name</label><input class="inp" id="nameIn" autocomplete="name"></div>`}
    ${isNew?"":`<div><span class="lbl">Status</span><div class="seg"><button data-status="open" aria-pressed="${s.status!=="fixed"}">Open</button><button data-status="fixed" aria-pressed="${s.status==="fixed"}">Fixed</button></div></div>`}
    <div class="row2">
      ${isNew?`<button class="btn ghost" id="saveNext">Save &amp; next photo</button>`:""}
      <button class="btn primary" id="saveBtn">Save</button>
    </div>
    ${isNew?"":`<div id="delWrap"><button class="btn danger" id="delBtn" style="width:100%">Delete item</button></div>`}
    <div class="saved-note" id="sheetNote"></div>
  </div>`;
}
function existingHtml(s){
  if(!s.room)return "";
  const nm=numberMap();
  const list=sorted().filter(i=>i.room===s.room&&i.id!==s.id);
  if(!list.length)return `<div class="exist"><span class="lbl">Already in ${esc(s.room)}</span><div class="exnone">Nothing logged in this room yet.</div></div>`;
  return `<div class="exist"><span class="lbl">Already in ${esc(s.room)} (${list.length})</span><div class="exlist">${list.map(it=>{const p=(it.photos||[])[0];return `<div class="exrow${it.status==="fixed"?" isfixed":""}">
    <div class="exth" style="${p?`background-image:url('${esc(photoSrc(p))}')`:""}"></div>
    <div class="exbody"><span class="num">ITEM ${pad(nm[it.id])}${it.status==="fixed"?" · FIXED":""}</span><span class="extx">${esc(it.issue||"No description")}${it.location?` <span class="loc">· ${esc(it.location)}</span>`:""}</span></div>
    ${!s.id&&s.photos.length?`<button class="btn ghost exadd" data-addto="${esc(it.id)}">Add photo here</button>`:""}</div>`}).join("")}</div></div>`;
}
function readSheetInputs(){
  if(!sheetState)return;const i=$("#issueIn"),l=$("#locIn"),n=$("#nameIn");
  if(i)sheetState.issue=i.value.trim();if(l)sheetState.location=l.value.trim();
  if(n&&n.value.trim()){myName=n.value.trim();ls.set("pl_name",myName)}
}

function commitSheet(thenNext){
  readSheetInputs();const s=sheetState;
  if(!s.photos.length){$("#sheetNote").textContent="Add at least one photo.";return}
  if(!s.room){$("#sheetNote").textContent="Pick a room.";return}
  const id=s.id||newId();const prev=items[id]||{};
  items[id]={id,room:s.room,issue:s.issue,location:s.location,status:s.status||"open",addedBy:prev.addedBy||myName,createdAt:prev.createdAt||Date.now(),photos:s.photos};
  lastRoom=s.room;ls.set("pl_lastRoom",lastRoom);
  closeSheet();
  if(filter!=="All"&&filter!==s.room)filter="All";
  view="items";render();
  persistItem(id);
  if(thenNext)$("#camIn").click();
}

async function addFiles(files,toSheet){
  if(!files||!files.length)return;
  const out=[];
  for(const f of files){
    try{const c=await compress(f);const tmp="t"+newId();imgCache[tmp]=c.dataUrl;out.push({tmp,w:c.w,h:c.h})}
    catch(e){toast(e.message,3000)}
  }
  if(!out.length)return;
  if(toSheet&&sheetState){sheetState.photos.push(...out);drawSheet();return}
  openSheet({id:null,photos:out,room:lastRoom&&roomOrder().includes(lastRoom)?lastRoom:null,issue:"",location:"",status:"open"});
}

/* ---------- PDF ---------- */
async function toDataUrl(p){
  if(imgCache[p.id])return imgCache[p.id];
  if(p.tmp&&imgCache[p.tmp])return imgCache[p.tmp];
  const r=await api("getPhoto",{id:p.id});
  imgCache[p.id]=r.data;return r.data;
}
let lastPdf=null;
async function makePdf(){
  const btn=$("#pdfBtn");btn.classList.add("wait");
  $("#pdfOut").innerHTML='<div class="saved-note" style="display:flex;gap:8px;align-items:center"><span class="spin"></span> Please wait, building your report…</div>';
  try{
    const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"pt",format:"letter"});
    const W=612,H=792,M=44,CW=W-2*M;let y=M;
    const all=reportItems(sorted());const nm=numberMap();const rooms=roomOrder().filter(r=>all.some(i=>i.room===r));
    const need=[].concat(...all.map(i=>i.photos||[])).filter(p=>!imgCache[p.id]&&!(p.tmp&&imgCache[p.tmp]));
    for(let i=0;i<need.length;i+=6)await Promise.all(need.slice(i,i+6).map(p=>toDataUrl(p).catch(()=>null)));
    const ink=[24,33,45],muted=[93,104,120],accent=[36,87,197];
    const date=new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
    doc.setFillColor(...accent);doc.rect(0,0,W,6,"F");
    doc.setTextColor(...ink);doc.setFont("helvetica","bold");doc.setFontSize(22);doc.text(settings.title||"Builder Warranty Punch List",M,y+20);y+=40;
    doc.setFontSize(11);
    [["Property",settings.address],["Homeowner",settings.owner],["Builder",settings.builder],["Report date",date],["Items",String(all.length)+(reportScope==="open"?" open":"")]].forEach(([k,v])=>{if(!v)return;doc.setFont("helvetica","bold");doc.setTextColor(...muted);doc.text(k.toUpperCase(),M,y);doc.setFont("helvetica","normal");doc.setTextColor(...ink);doc.text(String(v),M+90,y);y+=16});
    y+=8;doc.setDrawColor(220,225,232);doc.line(M,y,W-M,y);y+=20;
    doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(...ink);doc.text("Summary by room",M,y);y+=16;
    doc.setFontSize(10.5);
    rooms.forEach(r=>{const li=all.filter(i=>i.room===r);doc.setFont("helvetica","normal");doc.setTextColor(...ink);doc.text(r,M,y);doc.text(String(li.length),W-M,y,{align:"right"});
      doc.setTextColor(...muted);doc.setFontSize(9);doc.text(doc.splitTextToSize("Items "+li.map(i=>pad(nm[i.id])).join(", "),CW-210)[0],M+170,y);doc.setFontSize(10.5);y+=15;if(y>H-M){doc.addPage();y=M}});
    for(const r of rooms){
      doc.addPage();y=M;
      doc.setFillColor(...accent);doc.rect(M,y,4,20,"F");doc.setFont("helvetica","bold");doc.setFontSize(17);doc.setTextColor(...ink);doc.text(r.toUpperCase(),M+12,y+15);
      const cnt=all.filter(i=>i.room===r).length;doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(...muted);doc.text(cnt+" item"+(cnt===1?"":"s"),W-M,y+15,{align:"right"});y+=36;
      for(const it of all.filter(i=>i.room===r)){
        const photos=it.photos||[];const one=photos.length===1;const colW=(CW-12)/2;
        const dims=photos.map(p=>{const ar=(p.h&&p.w)?p.h/p.w:0.75;let w=one?Math.min(CW,360):colW;let h=w*ar;const maxH=one?300:220;if(h>maxH){h=maxH;w=h/ar}return{w,h}});
        const rows=[];for(let i=0;i<dims.length;i+=(one?1:2))rows.push(dims.slice(i,i+(one?1:2)));
        doc.setFont("helvetica","bold");doc.setFontSize(12);const issueLines=doc.splitTextToSize(it.issue||"No description",CW);
        const textH=18+issueLines.length*15+(it.location?14:0)+10;
        const firstRowH=rows.length?Math.max(...rows[0].map(d=>d.h)):0;
        if(y+textH+firstRowH>H-M-20){doc.addPage();y=M}
        doc.setFont("courier","bold");doc.setFontSize(10);doc.setTextColor(...muted);doc.text("ITEM "+pad(nm[it.id]),M,y+10);
        if(it.status==="fixed"){doc.setFillColor(30,138,85);doc.roundedRect(M+60,y+1,40,13,2,2,"F");doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(8);doc.text("FIXED",M+80,y+10,{align:"center"})}
        y+=18;doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(...ink);doc.text(issueLines,M,y+10);y+=issueLines.length*15;
        if(it.location){doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(...muted);doc.text("Location: "+it.location,M,y+8);y+=14}
        y+=10;let pi=0;
        for(const row of rows){
          const rh=Math.max(...row.map(d=>d.h));if(y+rh>H-M-20){doc.addPage();y=M}
          let x=M;
          for(const d of row){try{doc.addImage(await toDataUrl(photos[pi]),"JPEG",x,y,d.w,d.h,undefined,"FAST")}catch(e){doc.setDrawColor(200);doc.rect(x,y,d.w,d.h);doc.setFontSize(9);doc.setTextColor(...muted);doc.text("Photo unavailable",x+8,y+16)}x+=d.w+12;pi++}
          y+=rh+10;
        }
        y+=8;doc.setDrawColor(225,229,236);doc.line(M,y,W-M,y);y+=16;
      }
    }
    const n=doc.getNumberOfPages();
    for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(...muted);doc.text((settings.address||"Warranty punch list")+" · "+date,M,H-24);doc.text("Page "+i+" of "+n,W-M,H-24,{align:"right"})}
    const blob=doc.output("blob");
    const name=((settings.address||"warranty")+" punch list "+new Date().toISOString().slice(0,10)).replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-")+".pdf";
    if(lastPdf)URL.revokeObjectURL(lastPdf.url);
    lastPdf={url:URL.createObjectURL(blob),file:new File([blob],name,{type:"application/pdf"}),name};
    const canShare=navigator.canShare&&navigator.canShare({files:[lastPdf.file]});
    $("#pdfOut").innerHTML=`<div class="row2">${canShare?'<button class="btn ghost" id="sharePdf">Share / Save</button>':""}<a class="btn ghost" href="${lastPdf.url}" download="${esc(name)}" target="_blank" rel="noopener" style="text-decoration:none">Open PDF</a></div>`;
  }catch(e){
    $("#pdfOut").innerHTML="";toast("Couldn't make the PDF: "+((e&&e.message)||e),3500);
  }finally{btn.classList.remove("wait")}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.closest(".tabs")){view=t.dataset.v;render();window.scrollTo(0,0);if(view!=="setup")refresh();return}
  if(t.id==="shootBtn"){$("#camIn").click();return}
  if(t.id==="libBtn"){$("#libIn").click();return}
  if(t.dataset.f){filter=t.dataset.f;render();return}
  if(t.classList.contains("card")){
    const id=t.dataset.id;const it=items[id];
    if(localState[id]&&localState[id].status==="err"){persistItem(id);return}
    if(localState[id]&&localState[id].status==="saving")return;
    openSheet({id,photos:(it.photos||[]).map(p=>Object.assign({},p)),room:it.room,issue:it.issue,location:it.location,status:it.status||"open"});return}
  if(t.id==="sClose"){closeSheet();return}
  if(t.id==="addAngle"){readSheetInputs();addToSheet=true;$("#camIn").click();return}
  if(t.dataset.rmph!=null){readSheetInputs();sheetState.photos.splice(+t.dataset.rmph,1);drawSheet();return}
  if(t.dataset.addto){
    // attach the new photo(s) to an item that's already logged instead of making a duplicate
    const it=items[t.dataset.addto];if(!it||!sheetState)return;
    const extra=sheetState.photos;
    openSheet({id:it.id,photos:(it.photos||[]).map(p=>Object.assign({},p)).concat(extra),room:it.room,issue:it.issue,location:it.location,status:it.status||"open"});
    $("#sheetNote").textContent="Photo added to Item "+pad(numberMap()[it.id])+". Tap Save to keep it.";
    return}
  if(t.dataset.room){readSheetInputs();sheetState.room=t.dataset.room;drawSheet();if(!sheetState.issue)setTimeout(()=>$("#issueIn")&&$("#issueIn").focus(),0);return}
  if(t.dataset.q){readSheetInputs();sheetState.issue=t.dataset.q;drawSheet();return}
  if(t.dataset.status){readSheetInputs();sheetState.status=t.dataset.status;drawSheet();return}
  if(t.id==="saveBtn"){commitSheet(false);return}
  if(t.id==="saveNext"){commitSheet(true);return}
  if(t.id==="delBtn"){$("#delWrap").innerHTML='<div class="confirm"><span style="flex:1">Delete this item and its photos for everyone?</span><button class="btn danger" id="delYes">Delete</button><button class="btn ghost" id="delNo">Keep</button></div>';return}
  if(t.id==="delNo"){drawSheet();return}
  if(t.id==="delYes"){
    const id=sheetState.id;const backup=items[id];closeSheet();delete items[id];delete localState[id];render();
    api("delete",{id}).then(()=>toast("Item deleted")).catch(err=>{items[id]=backup;render();toast("Couldn't delete: "+err.message,3000)});
    return}
  if(t.dataset.scope){reportScope=t.dataset.scope;$("#pdfOut")&&($("#pdfOut").innerHTML="");render();return}
  if(t.id==="pdfBtn"){makePdf();return}
  if(t.id==="sharePdf"&&lastPdf){navigator.share({files:[lastPdf.file],title:lastPdf.name}).catch(()=>{});return}
  if(t.id==="addRoom"){const v=$("#newRoom").value.trim();if(v&&!settings.rooms.includes(v)){saveSettings({rooms:settings.rooms.concat(v)});renderSetup()}return}
  if(t.dataset.del!=null){const r=settings.rooms.slice();r.splice(+t.dataset.del,1);saveSettings({rooms:r});renderSetup();return}
  if(t.dataset.up!=null){const i=+t.dataset.up;if(i>0){const r=settings.rooms.slice();[r[i-1],r[i]]=[r[i],r[i-1]];saveSettings({rooms:r});renderSetup()}return}
});
$("#camIn").addEventListener("change",async e=>{const f=[...e.target.files];e.target.value="";const ts=addToSheet&&!!sheetState;addToSheet=false;await addFiles(f,ts)});
$("#libIn").addEventListener("change",async e=>{const f=[...e.target.files];e.target.value="";await addFiles(f,!!sheetState)});
$("#scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&sheetState)closeSheet();
  if(e.key==="Enter"&&e.target.id==="issueIn"){e.preventDefault();$("#locIn").focus()}
  if(e.key==="Enter"&&e.target.id==="locIn"){e.preventDefault();e.target.blur()}
  if(e.key==="Enter"&&e.target.id==="newRoom"){e.preventDefault();$("#addRoom").click()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="sName"){myName=e.target.value.trim();ls.set("pl_name",myName);$("#setNote").textContent="✓ Saved on this phone";return}
  const m={sTitleIn:"title",sAddr:"address",sOwner:"owner",sBuilder:"builder"}[e.target.id];
  if(m)saveSettings({[m]:e.target.value.trim()});
});

if(PW)refresh();else lock();
})();
</script>
