<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Warranty Punch List</title>
<meta name="theme-color" content="#2457C5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Punch List">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header, photo-tile grid grouped by room, fixed bottom tab bar
   with a raised camera button, full-screen entry screen with a sticky action footer. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#18212D; --muted:#5D6878; --line:#DCE1E8;
  --accent:#2457C5; --accent-ink:#FFFFFF; --tape:#E8A317; --ok:#1E8A55; --bad:#C2372F;
  --chip:#E8EDF5; --shade:rgba(10,14,20,.55);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --nav-h:68px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --gutter-l:max(16px,env(safe-area-inset-left,0px));
  --gutter-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151C; --surface:#18202A; --ink:#E7ECF2; --muted:#98A3B3; --line:#2A3542;
  --accent:#6E98F0; --accent-ink:#0C1320; --tape:#F0B93E; --ok:#4CC08A; --bad:#EE6A61; --chip:#222C39; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#18202A; --ink:#E7ECF2; --muted:#98A3B3; --line:#2A3542;
  --accent:#6E98F0; --accent-ink:#0C1320; --tape:#F0B93E; --ok:#4CC08A; --bad:#EE6A61; --chip:#222C39; color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
body.locked{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
input{font-size:17px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:var(--gutter-l);padding-right:var(--gutter-r);max-width:820px;margin:0 auto}
.num{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);letter-spacing:.02em}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hrow{display:flex;align-items:center;gap:12px;padding-block:10px}
.hrow h1{flex:1;min-width:0;margin:0;font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1.05}
.hrow h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.openpill{flex:none;display:flex;flex-direction:column;align-items:center;background:var(--chip);border-radius:12px;padding:4px 12px;min-width:64px}
.openpill b{font-family:var(--f-display);font-size:1.5rem;line-height:1}
.openpill span{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;min-height:38px;font-size:.92rem;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:.72rem;opacity:.7}

.banner{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--chip);font-size:.92rem;color:var(--muted)}
.banner:empty{display:none}

main{padding-block:8px calc(var(--nav-h) + var(--safe-b) + 28px)}

/* items grid */
.room{margin-top:20px}
.room h2{margin:0 0 10px;display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;text-transform:uppercase;letter-spacing:.05em}
.room h2 .num{font-size:.8rem}
.room h2::after{content:"";flex:1;height:1px;background:var(--line);align-self:center}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;min-width:0}
.tile .ph{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--chip) center/cover no-repeat}
.tile .badge{position:absolute;left:8px;top:8px;background:rgba(12,16,22,.72);color:#fff;font-family:var(--f-mono);font-size:.72rem;padding:2px 7px;border-radius:6px}
.tile .tag{position:absolute;right:8px;top:8px}
.tile .cap{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .issue{font-weight:700;font-size:.95rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile .loc{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .by{font-size:.75rem;color:var(--muted)}
.tile.isfixed .ph{opacity:.55}
.tile.isfixed .issue{text-decoration:line-through;color:var(--muted)}
.tag{border-radius:6px;padding:2px 7px;font-weight:700;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase}
.tag.open{background:var(--tape);color:#1d1606}
.tag.fixed{background:var(--ok);color:#fff}
.st{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;margin-top:2px}
.st.saving{color:var(--muted)} .st.saved{color:var(--ok)} .st.err{color:var(--bad)}

.empty{margin-top:28px;text-align:center;color:var(--muted);padding:32px 18px;border:1.5px dashed var(--line);border-radius:16px}
.empty strong{display:block;font-family:var(--f-display);font-size:1.5rem;color:var(--ink);margin-bottom:6px}

.spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block;flex:none}
.spin.big{width:30px;height:30px;border-width:3px}
@keyframes sp{to{transform:rotate(360deg)}}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:var(--nav-h)}
.nav button{border:0;background:transparent;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:700;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .cam{position:relative}
.nav .cam .fab{width:66px;height:66px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin-top:-30px;box-shadow:0 6px 18px rgba(36,87,197,.35);border:4px solid var(--surface)}
.nav .cam .fab svg{width:30px;height:30px}
.nav .cam span{color:var(--ink)}

.btn{border:0;border-radius:14px;min-height:52px;padding:0 18px;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.btn.wait{filter:blur(1px);opacity:.6;pointer-events:none}
.btn svg{width:22px;height:22px;flex:none}

/* full-screen entry screen */
.screen{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;height:100%;height:100dvh}
.sbar{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sbar .wrap{display:flex;align-items:center;gap:8px;min-height:56px}
.sbar h3{flex:1;margin:0;text-align:center;font-family:var(--f-display);font-size:1.35rem}
.sbar .side{flex:none;width:84px;display:flex}
.sbar .side.r{justify-content:flex-end}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:700;min-height:44px;padding:0 4px;font-size:1rem}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sbody .wrap{display:grid;gap:20px;padding-block:14px 24px}
.sfoot{flex:none;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + var(--safe-b))}
.sfoot .wrap{display:flex;gap:10px;padding-top:10px}
.sfoot .btn{flex:1}
.sfoot .btn.primary{flex:1.6}
.bigph{position:relative;border-radius:14px;overflow:hidden;background:#0d1117;display:flex;align-items:center;justify-content:center;height:34vh;min-height:180px;max-height:340px}
.bigph img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.bigph .zoom{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700}
.thumbs{display:flex;gap:8px;overflow-x:auto}
.thumbs button{flex:none;width:64px;height:64px;border-radius:10px;border:2px solid transparent;background:var(--chip) center/cover no-repeat;padding:0}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.lbl{display:block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.rbtn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.95rem;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left;line-height:1.15}
.rbtn .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);flex:none}
.rbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rbtn[aria-pressed="true"] .n{color:inherit;opacity:.8}
.rbtn.new{border-style:dashed;color:var(--accent);justify-content:center}
.newroom{display:flex;gap:8px;margin-top:10px}
.newroom .inp{flex:1;min-width:0}
.newroom .btn{min-height:50px;padding:0 14px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;min-height:52px;font-size:17px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.quick .chip{min-height:40px}
.exist{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.exist summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;padding:0 14px;font-weight:700;cursor:pointer}
.exist summary::-webkit-details-marker{display:none}
.exist summary::after{content:"Show";font-size:.85rem;color:var(--accent)}
.exist[open] summary::after{content:"Hide"}
.exlist{display:grid;gap:2px;padding:0 8px 8px;max-height:300px;overflow-y:auto}
.exrow{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px;min-width:0}
.exth{flex:none;width:52px;height:52px;border-radius:8px;background:var(--chip) center/cover no-repeat}
.exbody{flex:1;min-width:0;display:flex;flex-direction:column}
.extx{font-weight:600;font-size:.95rem;overflow-wrap:anywhere}
.exrow.isfixed .extx{text-decoration:line-through;color:var(--muted)}
.exnone{padding:0 14px 14px;color:var(--muted);font-size:.92rem}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:44px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.note{font-size:.88rem;color:var(--muted);min-height:1.2em;display:flex;gap:8px;align-items:center}
.note.err{color:var(--bad)}
.confirm{display:grid;gap:10px;background:var(--chip);padding:14px;border-radius:12px}
.confirm .row{display:flex;gap:10px}
.confirm .row .btn{flex:1}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:30;background:#000;display:flex;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:1.2rem}

/* report + setup */
.rhead{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:4px;margin-top:12px}
.rhead .t{font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1.1;text-wrap:balance}
.rhead .s{color:var(--muted);font-size:.92rem}
.rsum{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rsum span{font-family:var(--f-mono);font-size:.75rem;background:var(--chip);border-radius:6px;padding:3px 8px}
.rtools{display:grid;gap:10px;margin-top:12px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2 > *{flex:1;min-width:140px}
.form{display:grid;gap:18px;margin-top:14px}
.roomrow{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px;min-height:56px}
.roomrow span{flex:1;min-width:0;font-weight:600}
.roomrow button{border:0;background:var(--chip);border-radius:10px;width:44px;height:44px;font-size:1rem}
.list{display:grid;gap:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 16px);z-index:40;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:.95rem;max-width:calc(100% - 32px);text-align:center}
body.locked .toast{bottom:calc(96px + var(--safe-b))}

/* password screen */
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.gbox{width:100%;max-width:360px;display:grid;gap:14px;text-align:center;color:var(--accent)}
.gbox h2{margin:0 0 6px;font-family:var(--f-display);font-size:2rem;color:var(--ink)}
.gbox .lbl{text-align:left;margin:0}
.gbox .note{justify-content:center}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2s}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hrow">
      <h1 id="hTitle">Warranty Punch List<small id="hSub">Add your address in Setup</small></h1>
      <div class="openpill"><b id="hCount">0</b><span>Open</span></div>
    </div>
    <div class="filters" id="filters" hidden></div>
  </div>
</header>

<main class="wrap">
  <div class="banner" id="banner"></div>
  <section id="v-items"><div class="empty"><span class="spin big"></span><br>Loading items…</div></section>
  <section id="v-report" hidden></section>
  <section id="v-setup" hidden></section>
</main>

<nav class="nav" aria-label="Main">
  <div class="in">
    <button data-v="items" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Items</button>
    <button data-v="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>Report</button>
    <button class="cam" id="shootBtn" aria-label="Take photo"><span class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span>Photo</span></button>
    <button id="libBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>Library</button>
    <button data-v="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Setup</button>
  </div>
</nav>

<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="libIn" accept="image/*" multiple hidden>

<div class="screen" id="screen" hidden role="dialog" aria-modal="true" aria-labelledby="sTitle"></div>
<div class="lightbox" id="lightbox" hidden><img id="lbImg" alt=""><button id="lbClose" aria-label="Close photo">✕</button></div>
<div class="toast" id="toast" hidden></div>

<div class="gate" id="gate" hidden>
  <form class="gbox" id="gateForm" autocomplete="off">
    <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin:0 auto"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <h2>Warranty Punch List</h2>
    <label class="lbl" for="gatePw">Password</label>
    <input class="inp" id="gatePw" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button class="btn primary" id="gateBtn" type="submit">Open</button>
    <div class="note" id="gateMsg"></div>
  </form>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
const DEFAULT_ROOMS=["Kitchen","Living Room","Dining Room","Primary Bedroom","Primary Bath","Bedroom 2","Bedroom 3","Bathroom 2","Laundry","Garage","Hallway / Stairs","Exterior"];
const QUICK=["Drywall crack","Nail pop","Paint touch-up","Caulk gap","Scratch / chip","Door won't latch","Cabinet adjustment","Grout / tile crack","Water stain / leak","Trim gap","Floor squeak","Outlet / switch"];
const POLL_MS=15000;
const SCRIPT_URL=(window.PUNCH_CONFIG||{}).scriptUrl||"https://script.google.com/macros/s/AKfycbwIte83MJal_BG8DHY8Gqr5LiDlHkFqHiph_c_wuO0kHOd6bBGtj1SltozAVnDOGDb61w/exec";

const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let PW=ls.get("pl_pw")||"";
let items={}, localState={}, imgCache={};
let settings={title:"",address:"",builder:"",owner:"",rooms:DEFAULT_ROOMS.slice()};
let view="items", filter="All", lastRoom=ls.get("pl_lastRoom"), myName=ls.get("pl_name")||"";

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");

function toast(msg,ms){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms||1800)}
function banner(msg){$("#banner").textContent=msg||""}

/* ---------- Google backend ---------- */
async function api(action,data){
  const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),action==="photo"?60000:20000);
  let r;
  try{r=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify(Object.assign({action,pw:PW},data||{})),redirect:"follow",credentials:"omit",signal:ctl.signal})}
  catch(e){clearTimeout(timer);throw new Error(e.name==="AbortError"?"Google took too long to answer. Check your signal and try again.":"Couldn't reach Google. Check your signal and try again.")}
  let j={};try{j=await r.json()}catch(e){clearTimeout(timer);throw new Error("Google didn't answer. Check your connection and try again.")}
  clearTimeout(timer);
  if(j.auth===false){lock();throw new Error("Enter the password")}
  if(j.error)throw new Error(j.error);
  return j;
}

/* ---------- password screen ---------- */
function lock(msg){
  PW="";ls.set("pl_pw","");
  $("#gate").hidden=false;$("#gateMsg").textContent=msg||"";setTimeout(()=>$("#gatePw").focus(),50);
}
$("#gateForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const v=$("#gatePw").value.trim();if(!v)return;
  const b=$("#gateBtn");b.classList.add("wait");$("#gateMsg").innerHTML='<span class="spin"></span> Checking…';
  PW=v;
  try{await api("check");ls.set("pl_pw",PW);$("#gate").hidden=true;$("#gatePw").value="";$("#gateMsg").textContent="";refresh()}
  catch(err){$("#gateMsg").textContent=err.message==="Enter the password"?"That password isn't right.":err.message}
  finally{b.classList.remove("wait")}
});

/* ---------- loading + polling ---------- */
async function refresh(){
  if(!PW){lock();return}
  try{
    const d=await api("list");
    loaded=true;banner("");
    if(d.settings&&Object.keys(d.settings).length){settings=Object.assign({},settings,d.settings);if(!settings.rooms||!settings.rooms.length)settings.rooms=DEFAULT_ROOMS.slice()}
    const next={};
    d.items.forEach(it=>next[it.id]=it);
    Object.keys(localState).forEach(id=>{if(localState[id].status!=="saved"&&items[id])next[id]=items[id]});
    items=next;render();
    // refresh the "already in this room" list, but never while someone is typing
    if(entry&&!(document.activeElement&&document.activeElement.tagName==="INPUT")){readEntryInputs();drawEntry(true)}
  }catch(e){
    if(e.message==="Enter the password")return;
    banner("Can't reach the shared list right now. Check your signal and try again.");
    if(!loaded){loaded=true;render()}
  }
}
setInterval(()=>{if(!document.hidden&&PW)refresh()},POLL_MS);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&PW)refresh()});

/* ---------- images ---------- */
function compress(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{
      const max=1600;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);res({dataUrl:c.toDataURL("image/jpeg",0.8),w,h});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("That file couldn't be read as a photo."))};
    img.src=url;
  });
}
const driveThumb=(id,w)=>"https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w"+(w||600);
function photoSrc(p,w){return imgCache[p.id]||imgCache[p.tmp]||(p.id?driveThumb(p.id,w):"")}
function openLightbox(p){$("#lbImg").src=photoSrc(p,2000);$("#lightbox").hidden=false}

/* ---------- derived ---------- */
function sorted(){return Object.values(items).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}
function numberMap(){const m={};sorted().forEach((it,i)=>m[it.id]=i+1);return m}
function roomOrder(){const r=settings.rooms.slice();sorted().forEach(it=>{if(it.room&&!r.includes(it.room))r.push(it.room)});return r}

/* ---------- main views ---------- */
function render(){
  const all=sorted();
  $("#hCount").textContent=all.filter(i=>i.status!=="fixed").length;
  $("#hTitle").firstChild.nodeValue=settings.title||"Warranty Punch List";
  $("#hSub").textContent=[settings.address,settings.builder].filter(Boolean).join(" · ")||"Add your address in Setup";
  document.querySelectorAll(".nav [data-v]").forEach(b=>{if(b.dataset.v===view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  ["items","report","setup"].forEach(v=>$("#v-"+v).hidden=v!==view);
  if(!loaded)return;
  renderFilters(all);
  if(view==="items")renderItems(all);
  if(view==="report")renderReport(all);
  if(view==="setup"&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#v-setup input")))renderSetup();
}

function renderFilters(all){
  const f=$("#filters");
  if(view!=="items"||!all.length){f.hidden=true;return}
  const counts={};all.forEach(i=>counts[i.room]=(counts[i.room]||0)+1);
  if(filter!=="All"&&!counts[filter])filter="All";
  f.hidden=false;
  f.innerHTML=["All"].concat(roomOrder().filter(r=>counts[r])).map(r=>`<button class="chip" data-f="${esc(r)}" aria-pressed="${filter===r}">${esc(r)}<span class="n">${r==="All"?all.length:counts[r]}</span></button>`).join("");
}

function statusHtml(id){

  if(s.status==="saved")return '<span class="st saved">✓ Saved</span>';
  if(s.status==="saving")return '<span class="st saving"><span class="spin"></span>Saving…</span>';
  return '<span class="st err">Not saved · tap to retry</span>';
}
function tileHtml(it,nm,interactive){
  const p=(it.photos||[])[0];const fixed=it.status==="fixed";
  const tagName=interactive?"button":"div";
  return `<${tagName} class="tile${fixed?" isfixed":""}"${interactive?` data-id="${esc(it.id)}"`:""}>
    <div class="ph" style="${p?`background-image:url('${esc(photoSrc(p))}')`:""}"><span class="badge">${pad(nm[it.id])}</span>${fixed?'<span class="tag fixed">Fixed</span>':""}</div>

/* ---------- saving ---------- */
async function saveSettings(patch){
  Object.assign(settings,patch);render();
  const note=()=>$("#setNote");if(note())note().innerHTML='<span class="spin"></span> Saving…';
  try{await api("settings",{settings});if(note())note().textContent="✓ Saved"}
  catch(e){if(note())note().textContent="Not saved: "+e.message}
}

async function persistItem(id){
  const it=items[id];if(!it)return;
  localState[id]={status:"saving"};render();
  try{
    for(const p of it.photos){
      if(!p.id){
        const r=await api("photo",{data:imgCache[p.tmp],room:it.room,issue:it.issue||""});
        p.id=r.id;imgCache[r.id]=imgCache[p.tmp];
      }
    }
    const body={id,room:it.room,issue:it.issue||"",location:it.location||"",status:it.status||"open",addedBy:it.addedBy||"",createdAt:it.createdAt,
      photos:it.photos.map(p=>({id:p.id,w:p.w,h:p.h}))};
    const r=await api("save",{item:body});
    items[id]=r.item;localState[id]={status:"saved"};render();
    setTimeout(()=>{if(localState[id]&&localState[id].status==="saved"){delete localState[id];render()}},4000);
  }catch(e){
    localState[id]={status:"err"};render();
    toast("Not saved: "+e.message,3500);
  }
}

/* ---------- entry screen (one photo = one item) ---------- */
function openEntry(state){entry=state;$("#screen").hidden=false;document.body.classList.add("locked");drawEntry()}
function closeEntry(){entry=null;queue=[];$("#screen").hidden=true;$("#screen").innerHTML="";document.body.classList.remove("locked")}

function existingHtml(e){
  if(!e.room)return "";
  const nm=numberMap();const list=sorted().filter(i=>i.room===e.room&&i.id!==e.id);
  if(!list.length)return `<details class="exist"><summary>Nothing logged in ${esc(e.room)} yet</summary></details>`;
  return `<details class="exist"${e.showExisting?" open":""} id="existBox"><summary>Already in ${esc(e.room)} (${list.length})</summary><div class="exlist">${list.map(it=>{const p=(it.photos||[])[0];return `<div class="exrow${it.status==="fixed"?" isfixed":""}">
    <div class="exth" style="${p?`background-image:url('${esc(photoSrc(p,200))}')`:""}"></div>
    <div class="exbody"><span class="num">ITEM ${pad(nm[it.id])}${it.status==="fixed"?" · FIXED":""}</span><span class="extx">${esc(it.issue||"No description")}</span>${it.location?`<span class="num" style="font-family:var(--f-body)">${esc(it.location)}</span>`:""}</div></div>`}).join("")}</div></details>`;
}

    </div>

    ${isNew?"":`<div><span class="lbl">Status</span><div class="seg"><button data-status="open" aria-pressed="${e.status!=="fixed"}">Open</button><button data-status="fixed" aria-pressed="${e.status==="fixed"}">Fixed</button></div></div>
    <div id="delWrap">${e.confirmDelete?`<div class="confirm"><span>Delete this item and its photo for everyone?</span><div class="row"><button class="btn danger" id="delYes">Delete</button><button class="btn ghost" id="delNo">Keep</button></div></div>`:'<button class="btn danger" id="delBtn" style="width:100%">Delete item</button>'}</div>`}

      :qTotal>1?`<button class="btn ghost" id="eSkip">Skip photo</button><button class="btn primary" id="eSave">Save</button>`

      :`<button class="btn primary" id="eSave">Save changes</button>`}

function readEntryInputs(){
  if(!entry)return;const i=$("#issueIn"),l=$("#locIn"),n=$("#nameIn"),x=$("#existBox");
  if(i)entry.issue=i.value.trim();if(l)entry.location=l.value.trim();
  if(n&&n.value.trim()){myName=n.value.trim();ls.set("pl_name",myName)}
  if(x)entry.showExisting=x.open;
}
function note(msg,err){const n=$("#eNote");if(n){n.textContent=msg;n.classList.toggle("err",!!err);n.scrollIntoView({block:"nearest"})}}

function commitEntry(next){
  readEntryInputs();const e=entry;
  if(!e.room){note("Pick a room first.",true);return}
  if($("#nameIn")&&!myName)ls.set("pl_name_skip","1");
  const id=e.id||newId();const prev=items[id]||{};
  items[id]={id,room:e.room,issue:e.issue,location:e.location,status:e.status||"open",addedBy:prev.addedBy||myName,createdAt:prev.createdAt||Date.now(),photos:e.photos};
  lastRoom=e.room;ls.set("pl_lastRoom",lastRoom);
  if(filter!=="All"&&filter!==e.room)filter="All";
  persistItem(id);
  if(next==="queue"&&queue.length){
    const q=queue.shift();
    entry={id:null,photos:[q],room:e.room,issue:"",location:"",status:"open",qTotal:e.qTotal,qPos:(e.qPos||1)+1};
    drawEntry();$("#screen .sbody").scrollTop=0;toast("Saved · photo "+entry.qPos+" of "+entry.qTotal);
    return;
  }
  closeEntry();view="items";render();
  if(next==="camera")$("#camIn").click();
}

async function addFiles(files){
  if(!files||!files.length)return;
  const out=[];
  for(const f of files){
    try{const c=await compress(f);const tmp="t"+newId();imgCache[tmp]=c.dataUrl;out.push({tmp,w:c.w,h:c.h})}
    catch(err){toast(err.message,3000)}
  }
  if(!out.length)return;
  const first=out.shift();queue=out;
  const room=lastRoom&&roomOrder().includes(lastRoom)?lastRoom:null;
  openEntry({id:null,photos:[first],room,issue:"",location:"",status:"open",qTotal:out.length+1,qPos:1});
}

function addRoomFromEntry(){
  const inp=$("#newRoomIn");const v=inp?inp.value.trim().replace(/\s+/g," "):"";
  readEntryInputs();
  if(!v){inp&&inp.focus();return}
  const existing=settings.rooms.find(r=>r.toLowerCase()===v.toLowerCase());
  entry.addingRoom=false;entry.room=existing||v;
  if(!existing)saveSettings({rooms:settings.rooms.concat(v)});
  drawEntry(true);
  if(!existing)note("Added "+v+" to your rooms.");
}

/* ---------- PDF (2-column photo grid by room) ---------- */
async function toDataUrl(p){
  if(imgCache[p.id])return imgCache[p.id];
  if(p.tmp&&imgCache[p.tmp])return imgCache[p.tmp];
  const r=await api("getPhoto",{id:p.id});
  imgCache[p.id]=r.data;return r.data;
}
async function makePdf(){
  const btn=$("#pdfBtn");btn.classList.add("wait");
  $("#pdfOut").innerHTML='<div class="note"><span class="spin"></span> Please wait, building your report…</div>';
  try{
    if(!window.jspdf)throw new Error("the PDF tool didn't load. Check your signal, reload the page, and try again.");
    const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"pt",format:"letter"});
    const W=612,H=792,M=40,CW=W-2*M,BOT=H-M-22;let y=M;
    const all=reportItems(sorted());const nm=numberMap();const rooms=roomOrder().filter(r=>all.some(i=>i.room===r));
    const cells=[];all.forEach(it=>{const ps=(it.photos&&it.photos.length)?it.photos:[null];ps.forEach((p,k)=>cells.push({it,p,k,n:ps.length}))});
    const need=cells.map(c=>c.p).filter(p=>p&&!imgCache[p.id]&&!(p.tmp&&imgCache[p.tmp]));
    let done=0;
    for(let i=0;i<need.length;i+=6){await Promise.all(need.slice(i,i+6).map(p=>toDataUrl(p).catch(()=>null)));done=Math.min(need.length,i+6);$("#pdfOut").innerHTML=`<div class="note"><span class="spin"></span> Please wait, gathering photos ${done} of ${need.length}…</div>`}
    const ink=[24,33,45],muted=[93,104,120],accent=[36,87,197];
    const date=new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
    // cover
    doc.setFillColor(...accent);doc.rect(0,0,W,6,"F");
    doc.setTextColor(...ink);doc.setFont("helvetica","bold");doc.setFontSize(22);doc.text(settings.title||"Builder Warranty Punch List",M,y+20);y+=42;
    doc.setFontSize(11);
    [["Property",settings.address],["Homeowner",settings.owner],["Builder",settings.builder],["Report date",date],["Items",String(all.length)+(reportScope==="open"?" open":"")]].forEach(([k,v])=>{if(!v)return;doc.setFont("helvetica","bold");doc.setTextColor(...muted);doc.text(k.toUpperCase(),M,y);doc.setFont("helvetica","normal");doc.setTextColor(...ink);doc.text(String(v),M+90,y);y+=16});
    y+=8;doc.setDrawColor(220,225,232);doc.line(M,y,W-M,y);y+=22;
    doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(...ink);doc.text("Summary by room",M,y);y+=18;
    doc.setFontSize(10.5);
    rooms.forEach(r=>{const li=all.filter(i=>i.room===r);doc.setFont("helvetica","normal");doc.setTextColor(...ink);doc.text(r,M,y);doc.text(String(li.length),W-M,y,{align:"right"});
      doc.setTextColor(...muted);doc.setFontSize(9);doc.text(doc.splitTextToSize("Items "+li.map(i=>pad(nm[i.id])).join(", "),CW-210)[0],M+170,y);doc.setFontSize(10.5);y+=16;if(y>BOT){doc.addPage();y=M}});
    // rooms
    const GAP=16,cw=(CW-GAP)/2,ph=cw*0.75,capH=52,rowH=ph+capH+GAP;
    const roomHeader=(r,cont)=>{doc.setFillColor(...accent);doc.rect(M,y,4,20,"F");doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(...ink);doc.text(r.toUpperCase()+(cont?"  (continued)":""),M+12,y+15);
      if(!cont){const c=all.filter(i=>i.room===r).length;doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(...muted);doc.text(c+" item"+(c===1?"":"s"),W-M,y+15,{align:"right"})}y+=34};
    for(const r of rooms){
      doc.addPage();y=M;roomHeader(r,false);
      const rc=cells.filter(c=>c.it.room===r);
      for(let i=0;i<rc.length;i+=2){
        if(y+rowH>BOT){doc.addPage();y=M;roomHeader(r,true)}
        for(let k=0;k<2&&i+k<rc.length;k++){
          const c=rc[i+k];const x=M+k*(cw+GAP);
          doc.setFillColor(238,241,245);doc.rect(x,y,cw,ph,"F");
          if(c.p){try{const src=await toDataUrl(c.p);const ar=(c.p.w&&c.p.h)?c.p.h/c.p.w:0.75;let w=cw,h=cw*ar;if(h>ph){h=ph;w=ph/ar}doc.addImage(src,"JPEG",x+(cw-w)/2,y+(ph-h)/2,w,h,undefined,"FAST")}catch(err){doc.setFontSize(9);doc.setTextColor(...muted);doc.text("Photo unavailable",x+8,y+16)}}
          let cy=y+ph+13;
          doc.setFont("courier","bold");doc.setFontSize(9);doc.setTextColor(...muted);doc.text("ITEM "+pad(nm[c.it.id])+(c.n>1?" ("+(c.k+1)+"/"+c.n+")":""),x,cy);
          if(c.it.status==="fixed"){doc.setFillColor(30,138,85);doc.roundedRect(x+cw-38,cy-9,38,12,2,2,"F");doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.text("FIXED",x+cw-19,cy-0.5,{align:"center"})}
          cy+=13;doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.setTextColor(...ink);
          const lines=doc.splitTextToSize(c.it.issue||"No description",cw).slice(0,2);doc.text(lines,x,cy);cy+=lines.length*12;
          if(c.it.location){doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...muted);doc.text(doc.splitTextToSize(c.it.location,cw)[0],x,cy)}
        }
        y+=rowH;
      }
    }
    const n=doc.getNumberOfPages();
    for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(...muted);doc.text((settings.address||"Warranty punch list")+" · "+date,M,H-22);doc.text("Page "+i+" of "+n,W-M,H-22,{align:"right"})}
    const blob=doc.output("blob");
    const name=((settings.address||"warranty")+" punch list "+new Date().toISOString().slice(0,10)).replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-")+".pdf";
    if(lastPdf)URL.revokeObjectURL(lastPdf.url);
    lastPdf={url:URL.createObjectURL(blob),file:new File([blob],name,{type:"application/pdf"}),name};
    const canShare=navigator.canShare&&navigator.canShare({files:[lastPdf.file]});
    $("#pdfOut").innerHTML=`<div class="row2">${canShare?'<button class="btn primary" id="sharePdf">Share / Save PDF</button>':""}<a class="btn ghost" href="${lastPdf.url}" download="${esc(name)}" target="_blank" rel="noopener" style="text-decoration:none">Open PDF</a></div>`;
  }catch(err){
    $("#pdfOut").innerHTML="";toast("Couldn't make the PDF: "+((err&&err.message)||err),3500);
  }finally{btn.classList.remove("wait")}
}

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button");if(!t)return;
  // main navigation
  if(t.closest(".nav")&&t.dataset.v){view=t.dataset.v;render();window.scrollTo(0,0);if(view!=="setup")refresh();return}
  if(t.id==="shootBtn"){$("#camIn").click();return}
  if(t.id==="libBtn"){$("#libIn").click();return}
  if(t.dataset.f){filter=t.dataset.f;render();return}
  if(t.classList.contains("tile")&&t.dataset.id){
    const id=t.dataset.id;const it=items[id];
    if(localState[id]&&localState[id].status==="err"){persistItem(id);return}
    if(localState[id]&&localState[id].status==="saving"){toast("Still saving…");return}
    openEntry({id,photos:(it.photos||[]).map(p=>Object.assign({},p)),cur:0,room:it.room,issue:it.issue,location:it.location,status:it.status||"open"});return}
  // entry screen
  if(t.id==="eCancel"){closeEntry();render();return}
  if(t.id==="eZoom"){openLightbox(entry.photos[entry.cur||0]);return}
  if(t.dataset.cur!=null){readEntryInputs();entry.cur=+t.dataset.cur;drawEntry(true);return}
  if(t.id==="newRoomBtn"){readEntryInputs();entry.addingRoom=true;drawEntry(true);setTimeout(()=>$("#newRoomIn")&&$("#newRoomIn").focus(),0);return}
  if(t.id==="newRoomCancel"){readEntryInputs();entry.addingRoom=false;drawEntry(true);return}
  if(t.id==="newRoomAdd"){addRoomFromEntry();return}
  if(t.dataset.room){readEntryInputs();entry.room=t.dataset.room;drawEntry(true);return}
  if(t.dataset.q){readEntryInputs();entry.issue=t.dataset.q;drawEntry(true);return}
  if(t.dataset.status){readEntryInputs();entry.status=t.dataset.status;drawEntry(true);return}
  if(t.id==="eSave"){commitEntry(null);return}
  if(t.id==="eSkip"){
    if(queue.length){const q=queue.shift();readEntryInputs();entry={id:null,photos:[q],room:entry.room,issue:"",location:"",status:"open",qTotal:entry.qTotal,qPos:(entry.qPos||1)+1};drawEntry();toast("Skipped")}
    else{closeEntry();render();toast("Skipped")}
    return}
  if(t.id==="eNext"){commitEntry("queue");return}
  if(t.id==="eNextCam"){commitEntry("camera");return}
  if(t.id==="delBtn"){readEntryInputs();entry.confirmDelete=true;drawEntry(true);return}
  if(t.id==="delNo"){entry.confirmDelete=false;drawEntry(true);return}
  if(t.id==="delYes"){
    const id=entry.id;const backup=items[id];closeEntry();delete items[id];delete localState[id];render();
    api("delete",{id}).then(()=>toast("Item deleted")).catch(err=>{items[id]=backup;render();toast("Couldn't delete: "+err.message,3000)});
    return}
  // lightbox
  if(t.id==="lbClose"){$("#lightbox").hidden=true;$("#lbImg").src="";return}
  // report
  if(t.dataset.scope){reportScope=t.dataset.scope;render();return}
  if(t.id==="pdfBtn"){makePdf();return}
  if(t.id==="sharePdf"&&lastPdf){navigator.share({files:[lastPdf.file],title:lastPdf.name}).catch(()=>{});return}
  // setup
  if(t.id==="addRoom"){const v=$("#newRoom").value.trim();if(v&&!settings.rooms.some(r=>r.toLowerCase()===v.toLowerCase())){saveSettings({rooms:settings.rooms.concat(v)});renderSetup()}return}
  if(t.dataset.del!=null){const r=settings.rooms.slice();r.splice(+t.dataset.del,1);saveSettings({rooms:r});renderSetup();return}
  if(t.dataset.up!=null){const i=+t.dataset.up;if(i>0){const r=settings.rooms.slice();[r[i-1],r[i]]=[r[i],r[i-1]];saveSettings({rooms:r});renderSetup()}return}
  if(t.id==="signOut"){lock();return}
});
$("#lightbox").addEventListener("click",e=>{if(e.target.id==="lightbox"){$("#lightbox").hidden=true}});
$("#camIn").addEventListener("change",async e=>{const f=[...e.target.files];e.target.value="";await addFiles(f)});
$("#libIn").addEventListener("change",async e=>{const f=[...e.target.files];e.target.value="";await addFiles(f)});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(!$("#lightbox").hidden)$("#lightbox").hidden=true;else if(entry)closeEntry()}
  if(e.key==="Enter"&&e.target.id==="issueIn"){e.preventDefault();$("#locIn").focus()}
  if(e.key==="Enter"&&(e.target.id==="locIn"||e.target.id==="nameIn")){e.preventDefault();e.target.blur()}
  if(e.key==="Enter"&&e.target.id==="newRoomIn"){e.preventDefault();addRoomFromEntry()}
  if(e.key==="Enter"&&e.target.id==="newRoom"){e.preventDefault();$("#addRoom").click()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="sName"){myName=e.target.value.trim();ls.set("pl_name",myName);$("#setNote").textContent="✓ Saved on this phone";return}
  const m={sTitleIn:"title",sAddr:"address",sOwner:"owner",sBuilder:"builder"}[e.target.id];
  if(m)saveSettings({[m]:e.target.value.trim()});
});

render();
if(PW)refresh();else lock();
})();
</script>
</body>
